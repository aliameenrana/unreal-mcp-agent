[project]
name = "unreal-mcp"
version = "0.1.0"
description = "General-purpose MCP server that bridges an MCP client to a running Unreal Engine 5 editor via Python Remote Execution."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
